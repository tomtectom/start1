{% extends 'base.html' %}
{% block title %}Passwort ändern – {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">🔒</div>
    <h1 class="auth-title">Passwort ändern</h1>

    <form method="POST" class="auth-form" novalidate>
      <div class="form-group">
        <label for="current_password">Aktuelles Passwort</label>
        <div class="input-wrapper">
          <input type="password" id="current_password" name="current_password"
                 placeholder="Dein aktuelles Passwort" required autocomplete="current-password" />
          <button type="button" class="toggle-pw" data-target="current_password">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label for="new_password">Neues Passwort</label>
        <div class="input-wrapper">
          <input type="password" id="new_password" name="new_password"
                 placeholder="Mindestens 8 Zeichen" required autocomplete="new-password" />
          <button type="button" class="toggle-pw" data-target="new_password">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label for="new_password2">Passwort bestätigen</label>
        <div class="input-wrapper">
          <input type="password" id="new_password2" name="new_password2"
                 placeholder="Neues Passwort wiederholen" required autocomplete="new-password" />
          <button type="button" class="toggle-pw" data-target="new_password2">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-primary btn-full">Passwort ändern</button>
    </form>

    <p class="auth-footer">
      <a href="{{ url_for('main.index') }}" class="link-muted">← Zurück</a>
    </p>
  </div>
</div>
{% endblock %}
