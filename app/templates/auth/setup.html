{% extends 'base.html' %}
{% block title %}Ersteinrichtung – {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">🔐</div>
    <h1 class="auth-title">Ersteinrichtung</h1>
    <p class="auth-subtitle">Erstelle das Administrator-Konto.</p>

    <form method="POST" class="auth-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}" />

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ name }}"
               placeholder="Dein Name" required autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="email">E-Mail</label>
        <input type="email" id="email" name="email" value="{{ email }}"
               placeholder="admin@beispiel.de" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Passwort</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password"
                 placeholder="Mindestens 8 Zeichen" required autocomplete="new-password" />
          <button type="button" class="toggle-pw" data-target="password">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label for="password2">Passwort bestätigen</label>
        <div class="input-wrapper">
          <input type="password" id="password2" name="password2"
                 placeholder="Passwort wiederholen" required autocomplete="new-password" />
          <button type="button" class="toggle-pw" data-target="password2">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-primary btn-full">Konto erstellen</button>
    </form>
  </div>
</div>
{% endblock %}
