{% extends 'base.html' %}
{% block title %}Neues Passwort – {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">🔒</div>
    <h1 class="auth-title">Neues Passwort</h1>

    <form method="POST" class="auth-form" novalidate>
      <div class="form-group">
        <label for="password">Neues Passwort</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password"
                 placeholder="Mindestens 8 Zeichen" required autocomplete="new-password" />
          <button type="button" class="toggle-pw" data-target="password">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label for="password2">Passwort bestätigen</label>
        <div class="input-wrapper">
          <input type="password" id="password2" name="password2"
                 placeholder="Passwort wiederholen" required autocomplete="new-password" />
          <button type="button" class="toggle-pw" data-target="password2">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-primary btn-full">Passwort speichern</button>
    </form>
  </div>
</div>
{% endblock %}
